name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate strict SemVer tag
        run: bash scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            printf 'release already exists: %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi

  build:
    needs: [checks, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build native binary
        env:
          CGO_ENABLED: "0"
          # Pin GOFLAGS empty: inherited runner options (e.g. -toolexec) must
          # not alter the attested release binary.
          GOFLAGS: ""
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p out
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -buildid= -X github.com/sagmans/serverpro/internal/cli.Version=${GITHUB_REF_NAME}" \
            -o out/serverpro \
            ./cmd/serverpro

      - name: Smoke built binary
        working-directory: out
        run: |
          set -eu
          test "$(./serverpro --version)" = "serverpro version ${GITHUB_REF_NAME}"
          ./serverpro --help >/dev/null

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: out/serverpro
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
          - target: linux-arm64
          - target: darwin-amd64
          - target: darwin-arm64
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download native binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.target }}
          path: binary

      - name: Build deterministic archive
        run: |
          set -eu
          export LC_ALL=C TZ=UTC
          epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          name="serverpro-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          install -d -m 0755 "dist/${name}"
          install -m 0755 binary/serverpro "dist/${name}/serverpro"
          touch -d "@${epoch}" "dist/${name}" "dist/${name}/serverpro"
          tar \
            --sort=name \
            --mtime="@${epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            -C dist \
            -czf "dist/${name}.tar.gz" \
            "${name}"
          rm -rf "dist/${name}"

      - name: Generate target SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: binary/serverpro
          format: spdx-json
          output-file: dist/serverpro-${{ github.ref_name }}-${{ matrix.target }}.spdx.json
          syft-version: v1.48.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest target build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/serverpro-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - name: Attach target provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: install -m 0644 "${BUNDLE_PATH}" "dist/serverpro-${GITHUB_REF_NAME}-${{ matrix.target }}.provenance.sigstore.json"

      - name: Attest target SBOM
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/serverpro-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          sbom-path: dist/serverpro-${{ github.ref_name }}-${{ matrix.target }}.spdx.json

      - name: Attach target SBOM bundle
        env:
          BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: install -m 0644 "${BUNDLE_PATH}" "dist/serverpro-${GITHUB_REF_NAME}-${{ matrix.target }}.sbom.sigstore.json"

      - name: Upload target release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [checks, validate, package]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download target release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        run: |
          set -eu
          cd dist
          LC_ALL=C shasum -a 256 -- *.tar.gz *.json > SHA256SUMS

      - name: Classify release tag
        id: classify-release
        run: |
          set -eu
          prerelease=$(bash scripts/classify-release-tag.sh "${GITHUB_REF_NAME}")
          printf 'prerelease=%s\n' "${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.classify-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_args=()
          if [[ ${IS_PRERELEASE} == true ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" ./dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "serverpro ${GITHUB_REF_NAME}" \
            "${release_args[@]}"
