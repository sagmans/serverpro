name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run candidate checks
        run: make check

      - name: Build and verify release artifacts
        run: bash scripts/package-release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" dist

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Existing releases fail closed so reruns cannot replace reviewed assets.
          gh release create "${GITHUB_REF_NAME}" ./dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "serverpro ${GITHUB_REF_NAME}"
