name: CI

# Reusable only: release.yml calls it on tags. Push and PR checks moved to
# local Git hooks (.githooks) to save Actions minutes and so no outside PR
# can trigger runs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      # Controller checks require the same managed runtime as local hooks.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        timeout-minutes: 5
        with:
          version: '2026.10.23'
          cache: false
          mise_toml: |
            [tools]
            uv = "0.13.6"
        env:
          UV_PYTHON: "3.14.10"

      - name: Run checks
        env:
          UV_PYTHON: "3.14.10"
        run: make check

  full-chain-e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run hermetic full-chain journeys
        run: make test-full-chain-e2e
        env:
          SERVERPRO_E2E_ARTIFACT_DIR: .artifacts/full-chain-e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-chain-e2e-failure
          path: .artifacts/full-chain-e2e
          if-no-files-found: warn
          retention-days: 3
